[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchloop"
version = "0.1.0"
description = "A minimal, Docker-sandboxed coding agent that fixes real GitHub issues, evaluated on SWE-bench."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shubhi Sharma" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
swebench = ["datasets", "swebench"]
dev = ["pytest>=8"]

[project.scripts]
patchloop = "patchloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
